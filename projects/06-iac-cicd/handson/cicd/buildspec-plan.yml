# cicd/buildspec-plan.yml
# CodePipeline の Build ステージ(terraform plan)用 buildspec
# 標準イメージ(aws/codebuild/amazonlinux2-x86_64-standard:5.0 など)には
# Terraform が含まれないため、install フェーズで公式バイナリを取得します。
version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.9.8"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_DIR: "projects/06-iac-cicd/handson/environments/dev"

phases:
  install:
    commands:
      - echo "Installing Terraform ${TERRAFORM_VERSION}"
      - curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform version
  pre_build:
    commands:
      - cd "${TF_DIR}"
      - terraform init -input=false
      - terraform validate
  build:
    commands:
      - cd "${TF_DIR}"
      - terraform plan -input=false -out=tfplan
      # 承認担当者が読めるようにテキスト形式でも保存する
      - terraform show -no-color tfplan > tfplan.txt

artifacts:
  files:
    - tfplan
    - tfplan.txt
  base-directory: projects/06-iac-cicd/handson/environments/dev
  name: tfplan-artifact
